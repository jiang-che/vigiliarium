# 打 tag 时自动构建单一二进制并发布到 Release。
#
# 触发：
#   1. push 形如 v1.2.3 的 tag   → 构建并创建 Release、附上二进制
#   2. 手动 workflow_dispatch     → 只构建并上传为 Actions Artifact（不发 Release）
#
# 用法：
#   git tag v0.1.0
#   git push origin v0.1.0
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行测试
        run: python3 -m unittest discover -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 复用 packaging/Containerfile（Debian 12 / glibc 2.36），
      # 保证 CI 产物与本地 build.sh 完全一致。
      - name: 构建单文件二进制
        env:
          VIGI_CONTAINER_RUNTIME: docker
          VIGI_BUILD_IMAGE: vigiliarium-builder:ci
        run: bash packaging/build.sh

      - name: 整理产物与校验和
        run: |
          mkdir -p release
          cp dist/vigi release/vigi-x86_64-linux
          chmod +x release/vigi-x86_64-linux
          (cd release && sha256sum vigi-x86_64-linux > vigi-x86_64-linux.sha256)
          ls -l release

      - name: 上传 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigi-x86_64-linux
          path: release/*

      - name: 发布到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/vigi-x86_64-linux
            release/vigi-x86_64-linux.sha256
          generate_release_notes: true
